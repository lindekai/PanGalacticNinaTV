name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: PanGalacticCore (swift test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test
        working-directory: Packages/PanGalacticCore
        run: swift test

  m0-tools:
    name: M0 probe tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python3 -I tools/m0/tests/test_m0probe.py
